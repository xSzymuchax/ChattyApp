services:
  postgres:
    build: ./docker/postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./backend/auth-service
    restart: unless-stopped
    environment:
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      DATABASE_NAME: auth_db
      DATABASE_USER: auth_service
      DATABASE_PASSWORD: ${AUTH_DB_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      USER_SERVICE_URL: http://user-service:3002
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started

  user-service:
    build: ./backend/user-service
    restart: unless-stopped
    environment:
      PORT: 3002
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_NAME: user_db
      DATABASE_USER: user_service
      DATABASE_PASSWORD: ${USER_DB_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  chat-service:
    build: ./backend/chat-service
    restart: unless-stopped
    environment:
      PORT: 3003
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_NAME: chat_db
      DATABASE_USER: chat_service
      DATABASE_PASSWORD: ${CHAT_DB_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  game-service:
    build: ./backend/game-service
    restart: unless-stopped
    environment:
      PORT: 3004

  api-gateway:
    build: ./backend/api-gateway
    restart: unless-stopped
    environment:
      PORT: 3000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      CHAT_SERVICE_URL: http://chat-service:3003
      GAME_SERVICE_URL: http://game-service:3004
    depends_on:
      - auth-service
      - user-service
      - chat-service
      - game-service

  realtime-gateway:
    build: ./backend/realtime-gateway
    restart: unless-stopped
    environment:
      PORT: 3300
      JWT_SECRET: ${JWT_SECRET}
      CHAT_SERVICE_URL: http://chat-service:3003
      GAME_SERVICE_URL: http://game-service:3004
    depends_on:
      - chat-service
      - game-service

  caddy:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_RT_API_URL: /ws
        VITE_TOKEN_KEY: chatty.authToken
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
    depends_on:
      - api-gateway
      - realtime-gateway

volumes:
  postgres_data:
