apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-gateway
  labels:
    app: realtime-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realtime-gateway
  template:
    metadata:
      labels:
        app: realtime-gateway
    spec:
      containers:
        - name: realtime-gateway
          image: chatty-realtime-gateway
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3300
          env:
            - name: PORT
              value: "3300"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chatty-credentials
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chatty-credentials
                  key: INTERNAL_SERVICE_TOKEN
            - name: CHAT_SERVICE_URL
              value: http://chat-service:3003
            - name: GAME_SERVICE_URL
              value: http://game-service:3004
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-gateway
  labels:
    app: realtime-gateway
spec:
  selector:
    app: realtime-gateway
  ports:
    - name: http
      port: 3300
      targetPort: http
